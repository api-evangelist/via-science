note: >-
  VIA documents no rate limits anywhere on a publicly reachable surface. There is no REST
  contract, no developer portal quota page, and the ZTF documentation and tutorials do not
  mention throttling, quotas, retry guidance, X-RateLimit-*/RateLimit-* headers or
  Retry-After. The Keycloak identity server at auth.solvewithvia.com will have brute-force
  and request limits configured, but none of that is exposed in the discovery documents and
  none of it is documented for integrators. The AWS Marketplace listing meters data
  transferred by the GB, which is a billing meter and not a rate limit.

gaps:
