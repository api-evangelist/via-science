  hits are REALM-SCOPED on the Keycloak identity server at auth.solvewithvia.com, which
  publishes a full OpenID Connect discovery document, an OAuth 2.0 authorization-server
  metadata document (RFC 8414) and a UMA 2.0 configuration for each product realm. Those
  paths are recorded below with the exact path that answered. The documentation host
  (documentation.ztf.solvewithvia.com) answers 200 with the same 15,246-byte HTML shell
  for every /.well-known/* path, which is a single-page-app catch-all and NOT a document —
  it is recorded as a miss. qt.solvewithvia.com 302s every path to the Keycloak realm
  login, so nothing anonymous is served there.

