aid: via-science
name: Via Science
description: >-
  Via Science, Inc. — trading as VIA — is a Somerville, Massachusetts security company
  founded in 2016 that builds decentralized, quantum-resistant data and identity protection
  for governments, defense agencies and large enterprises. Its products are VIA ZTF (Zero
  Trust Fabric), a passwordless authentication fabric built on verifiable credentials, a
  decentralized identity registry and a mobile holder wallet; VIA QT (Quantum Transfer), an
  end-to-end quantum-resistant large-file transfer service sold direct and as a metered AWS
  Marketplace AMI; SLAM AI, which lets organizations use generative AI models without
  exposing confidential data and keeps an immutable record of every prompt, response and
  data transformation; VIA Wallet; and VIA Secure Chain. VIA raised a $28M Series B led by
  Bosch Ventures with BMW i Ventures, MassMutual Ventures and Sentinel Global. Its
  developer surface is an OpenID Connect identity layer — a Keycloak server at
  auth.solvewithvia.com that serves anonymous OIDC, RFC 8414 and UMA 2.0 discovery
  documents per product realm — plus ZTF documentation and four runnable reference
  integrations on GitHub. VIA publishes no OpenAPI or other resource contract for any
  product.
