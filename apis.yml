apis:
- name: VIA Zero Trust Fabric — OpenID Connect Identity
  description: >-
    VIA's OpenID Connect / OAuth 2.0 identity layer, operated on a VIA-run Keycloak server.
    It is the only machine-readable contract VIA publishes: each product realm serves an
    anonymous OIDC discovery document, and the `ztf_demo` realm additionally serves RFC 8414
    authorization-server metadata and a UMA 2.0 configuration. Applications integrate with
    Authorization Code + PKCE (S256) and receive a bearer JWT; Zero Trust Fabric layers
    passwordless login backed by W3C-style verifiable credentials held in the VIA Wallet,
    with a wallet signature required to step up for sensitive operations. The realms also
    advertise DPoP, Pushed Authorization Requests, mTLS-bound access tokens, token exchange,
    CIBA, the device authorization grant and dynamic client registration.
  humanURL: https://documentation.ztf.solvewithvia.com/
  baseURL: https://auth.solvewithvia.com/auth/realms/qt
  tags:
  - Authentication
  - Identity
  - OpenID Connect
  - OAuth
  - Zero Trust
