domain_standards:
  - id: w3c-verifiable-credentials
    conforms: true
    market: decentralized identity / zero-trust access
    evidence: >-
      ZTF is built on Verifiable Credentials and Verifiable Presentations as first-class
      components — "A tamper-resistant digital credential that represents claims about a
      subject in a cryptographically secure format", with named Issuer, Verifier, Holder
      (VIA Wallet) and DID Registry roles, at
      https://documentation.ztf.solvewithvia.com/via-ztf-components/. The VIA Wallet page
      states "Decentralized authentication using W3C 2.0 credentials".
    source: https://documentation.ztf.solvewithvia.com/via-ztf-components/
    note: >-
      VIA names the roles and the credential/presentation model but does not cite a W3C VC
      Data Model version, JSON-LD context, or DID method in any anonymously readable page —
      so this is a documented architectural conformance, not a verifiable profile claim.

  - id: w3c-decentralized-identifiers
    conforms: true
    market: decentralized identity
    evidence: >-
      "Decentralized Identity (DID) Registry — Self-sovereign identity management", listed
      as a core ZTF component, described as a server storing ephemeral keys for end-to-end
      encrypted communication between parties.
    source: https://documentation.ztf.solvewithvia.com/via-ztf-components/
    note: No DID method name or did:*-prefixed identifier is published anonymously.

  - id: nist-fips-203-ml-kem
    conforms: true
    market: post-quantum cryptography
    evidence: >-
      The ZTF DID Registry uses "a hybrid Key Encapsulation Mechanism combining ECDH (P-384)
      and ML-KEM-1024" — ML-KEM is the NIST FIPS 203 post-quantum KEM, and P-384 is NIST
      FIPS 186 / SP 800-186. This is the most specific cryptographic conformance VIA
      publishes and it is stated in the contract-bearing documentation, not on a marketing
      page.
    source: https://documentation.ztf.solvewithvia.com/via-ztf-components/

  - id: walletconnect-v2
    conforms: true
    market: web3 wallet session protocol
    evidence: >-
      ZTF step-up authentication is implemented over WalletConnect v2; the published
      Angular WalletConnectService exposes initialize / connect / sendTransaction /
      disconnect.
    source: https://documentation.ztf.solvewithvia.com/integration/

