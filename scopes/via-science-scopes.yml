acr_values_supported: ['0', '1']
acr_note: >-
  acr 0/1 is the hook ZTF step-up authentication uses — a sensitive operation is gated on a
  higher authentication context, satisfied by a VIA Wallet signature rather than a second
  password factor.

uma2:
