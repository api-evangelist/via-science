name: VIA (Via Science, Inc.) — published packages and distributions

summary: >-
  VIA publishes NO first-party client SDK on any language registry. Integration with VIA
  Zero Trust Fabric is done with the standard Keycloak clients — VIA's own tutorials depend
  on `keycloak-js` from the Keycloak project, not on a VIA package — plus a Helm chart whose
  values are documented but whose chart is not published to a public registry. What VIA does
  distribute publicly is end-user and appliance software: the VIA Wallet mobile apps and the
  Quantum Transfer sender AMI on AWS Marketplace.

