gaps:
  - >-
    No npm, PyPI, Maven Central, NuGet, RubyGems, Packagist, crates.io or pkg.go.dev
    package is published under any VIA name. An integrator writes their own Keycloak client.
  - >-
    The ZTF Helm chart is documented by its values (keycloak.url, keycloak.realm,
    keycloak.clientId) at https://documentation.ztf.solvewithvia.com/integration/ but the
    chart itself is not published to a public Helm repository or OCI registry, so the
    documented install path cannot actually be followed by a member of the public.
